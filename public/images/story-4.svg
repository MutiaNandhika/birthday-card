<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="sunsetBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFC2D1" />
      <stop offset="45%" stop-color="#FF8FAB" />
      <stop offset="80%" stop-color="#FFD166" />
      <stop offset="100%" stop-color="#FFF0F5" />
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#sunsetBg)" rx="24"/>

  <!-- Large sunset horizon -->
  <circle cx="400" cy="380" r="180" fill="#FFFFFF" fill-opacity="0.85"/>
  <circle cx="400" cy="380" r="140" fill="#FFD166" fill-opacity="0.7"/>

  <!-- Distant birds / silhouettes -->
  <path d="M 280 180 Q 290 170 300 180 Q 310 170 320 180" fill="none" stroke="#2B2730" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
  <path d="M 340 160 Q 348 152 356 160 Q 364 152 372 160" fill="none" stroke="#2B2730" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
  <path d="M 480 190 Q 488 182 496 190 Q 504 182 512 190" fill="none" stroke="#2B2730" stroke-width="2" stroke-linecap="round" opacity="0.55"/>

  <!-- Sparkles -->
  <polygon points="400,100 405,115 420,120 405,125 400,140 395,125 380,120 395,115" fill="#FFFFFF"/>
  <polygon points="560,240 563,248 571,250 563,252 560,260 557,252 549,250 557,248" fill="#FFFFFF" opacity="0.9"/>
  <polygon points="240,260 243,268 251,270 243,272 240,280 237,272 229,270 237,268" fill="#FFFFFF" opacity="0.9"/>

  <!-- Badge -->
  <rect x="230" y="490" width="340" height="44" rx="22" fill="#FFFFFF" fill-opacity="0.9" filter="drop-shadow(0 4px 6px rgba(0,0,0,0.05))"/>
  <text x="400" y="518" font-family="'Playfair Display', serif" font-size="16" font-weight="600" fill="#2B2730" text-anchor="middle" letter-spacing="2">HERE'S TO WHAT'S NEXT</text>
</svg>
