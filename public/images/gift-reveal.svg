<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="voucherBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF9F5"/>
      <stop offset="50%" stop-color="#FFE3E8"/>
      <stop offset="100%" stop-color="#FFF0F5"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD166"/>
      <stop offset="100%" stop-color="#FF8FAB"/>
    </linearGradient>
  </defs>
  
  <!-- Outer Card -->
  <rect x="20" y="20" width="760" height="460" rx="20" fill="url(#voucherBg)" stroke="#FFC2D1" stroke-width="4" stroke-dasharray="8,8"/>
  
  <!-- Ribbon Seal -->
  <circle cx="400" cy="110" r="50" fill="url(#goldGrad)" filter="drop-shadow(0 4px 8px rgba(0,0,0,0.1))"/>
  <text x="400" y="118" font-family="'Playfair Display', serif" font-size="28" fill="#FFFFFF" font-weight="bold" text-anchor="middle">VIP</text>

  <!-- Title & Pass -->
  <text x="400" y="200" font-family="'Playfair Display', serif" font-size="26" font-weight="bold" fill="#2B2730" text-anchor="middle">LIFETIME BIRTHDAY PASS</text>
  <text x="400" y="235" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="600" fill="#FF8FAB" text-anchor="middle" letter-spacing="3">OFFICIAL COMPANION CERTIFICATE</text>

  <!-- Divider -->
  <line x1="150" y1="260" x2="650" y2="260" stroke="#FFC2D1" stroke-width="2"/>

  <!-- Privileges -->
  <text x="400" y="300" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" fill="#2B2730" text-anchor="middle">✨ Unlimited listening sessions whenever you need to talk</text>
  <text x="400" y="335" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" fill="#2B2730" text-anchor="middle">☕ Free coffee, treats &amp; comfort food on demand</text>
  <text x="400" y="370" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" fill="#2B2730" text-anchor="middle">🌟 Unconditional support &amp; a cheerleader for life</text>

  <!-- Code Box -->
  <rect x="250" y="405" width="300" height="40" rx="8" fill="#2B2730"/>
  <text x="400" y="430" font-family="'Plus Jakarta Sans', monospace" font-size="14" font-weight="bold" fill="#FFD166" text-anchor="middle" letter-spacing="2">PASS: BDAY-2026-ALWAYS-LOVED</text>
</svg>
