<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bloomBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF5F7" />
      <stop offset="50%" stop-color="#FFD6E0" />
      <stop offset="100%" stop-color="#FF8FAB" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#2B2730" flood-opacity="0.1"/>
    </filter>
  </defs>
  <rect width="800" height="600" fill="url(#bloomBg)" rx="24"/>

  <!-- Blooming floral silhouette & aesthetic geometric curves -->
  <g transform="translate(400, 260)" filter="url(#shadow)">
    <!-- Central Flower Petals -->
    <ellipse cx="0" cy="-60" rx="35" ry="70" fill="#FFFFFF" opacity="0.95"/>
    <ellipse cx="60" cy="-20" rx="35" ry="70" fill="#FFFFFF" opacity="0.9" transform="rotate(60, 60, -20)"/>
    <ellipse cx="60" cy="50" rx="35" ry="70" fill="#FFFFFF" opacity="0.9" transform="rotate(120, 60, 50)"/>
    <ellipse cx="0" cy="80" rx="35" ry="70" fill="#FFFFFF" opacity="0.95"/>
    <ellipse cx="-60" cy="50" rx="35" ry="70" fill="#FFFFFF" opacity="0.9" transform="rotate(-120, -60, 50)"/>
    <ellipse cx="-60" cy="-20" rx="35" ry="70" fill="#FFFFFF" opacity="0.9" transform="rotate(-60, -60, -20)"/>
    
    <!-- Flower core -->
    <circle cx="0" cy="10" r="38" fill="#FFD166"/>
    <circle cx="0" cy="10" r="28" fill="#FF8FAB"/>
    <circle cx="0" cy="10" r="16" fill="#FFFFFF"/>
  </g>

  <!-- Sparkles -->
  <g fill="#FFFFFF">
    <polygon points="180,180 183,190 193,193 183,196 180,206 177,196 167,193 177,190" opacity="0.8"/>
    <polygon points="620,160 623,170 633,173 623,176 620,186 617,176 607,173 617,170" opacity="0.8"/>
    <polygon points="220,380 223,390 233,393 223,396 220,406 217,396 207,393 217,390" opacity="0.8"/>
    <polygon points="580,360 583,370 593,373 583,376 580,386 577,376 567,373 577,370" opacity="0.8"/>
  </g>

  <!-- Badge -->
  <rect x="250" y="490" width="300" height="44" rx="22" fill="#FFFFFF" fill-opacity="0.9" filter="drop-shadow(0 4px 6px rgba(0,0,0,0.05))"/>
  <text x="400" y="518" font-family="'Playfair Display', serif" font-size="16" font-weight="600" fill="#2B2730" text-anchor="middle" letter-spacing="2">ALWAYS BLOOMING</text>
</svg>
