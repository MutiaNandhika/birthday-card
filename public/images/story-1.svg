<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="sky1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE5EC" />
      <stop offset="50%" stop-color="#FFC2D1" />
      <stop offset="100%" stop-color="#FFD166" />
    </linearGradient>
    <radialGradient id="sun1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#FFD166" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#FF8FAB" stop-opacity="0" />
    </radialGradient>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="800" height="600" fill="url(#sky1)" rx="24"/>
  <circle cx="400" cy="280" r="160" fill="url(#sun1)" filter="url(#softGlow)"/>
  
  <!-- Subtle minimalist hills / horizon -->
  <path d="M-50 480 Q 200 400 450 490 T 850 460 L 850 650 L -50 650 Z" fill="#FF8FAB" fill-opacity="0.35"/>
  <path d="M-50 510 Q 300 460 550 520 T 850 490 L 850 650 L -50 650 Z" fill="#2B2730" fill-opacity="0.12"/>
  
  <!-- Sparkles -->
  <g fill="#FFFFFF" opacity="0.8">
    <circle cx="220" cy="180" r="3"/>
    <circle cx="580" cy="150" r="4"/>
    <circle cx="340" cy="120" r="2.5"/>
    <circle cx="650" cy="240" r="3.5"/>
    <circle cx="160" cy="270" r="2"/>
    <polygon points="400,160 405,175 420,180 405,185 400,200 395,185 380,180 395,175" fill="#FFFFFF"/>
    <polygon points="260,220 263,230 273,233 263,236 260,246 257,236 247,233 257,230" fill="#FFFFFF" opacity="0.75"/>
    <polygon points="540,210 543,220 553,223 543,226 540,236 537,226 527,223 537,220" fill="#FFFFFF" opacity="0.85"/>
  </g>
  
  <!-- Center caption overlay badge -->
  <rect x="260" y="490" width="280" height="44" rx="22" fill="#FFFFFF" fill-opacity="0.85" filter="url(#softGlow)"/>
  <text x="400" y="518" font-family="'Playfair Display', serif" font-size="16" font-weight="600" fill="#2B2730" text-anchor="middle" letter-spacing="2">WHERE IT ALL BEGAN</text>
</svg>
