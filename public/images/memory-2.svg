      <stop offset="0%" stop-color="#FFF0F5"/>
      <stop offset="50%" stop-color="#FFC2D1"/>
      <stop offset="100%" stop-color="#FF8FAB"/>
    </linearGradient>
  </defs>
  <rect width="600" height="600" fill="url(#mem2)"/>
  <circle cx="300" cy="260" r="130" fill="#FFFFFF" opacity="0.65"/>
  
