  <text x="300" y="440" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="600" fill="#2B2730" text-anchor="middle">Cozy Cafe Talks</text>
  <text x="300" y="470" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" fill="#8A7F86" text-anchor="middle">Replace with your photo in /public/images/</text>
